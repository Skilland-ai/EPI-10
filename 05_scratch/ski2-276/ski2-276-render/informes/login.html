        <main id="principal"><h1>Acceso a informes</h1>
      <p class="aviso" role="status">El enlace del back office ha caducado o ya se ha usado. Vuelve a abrirlo desde el back office o entra con tu usuario.</p>
      <form method="post" action="/informes/login" class="tarjeta formulario">
        <input type="hidden" name="_csrf" value="x" />
        
        <label for="usuario">Usuario</label>
        <input
          id="usuario"
          name="usuario"
          type="text"
          autocomplete="username"
          required
          autofocus
          autocapitalize="none"
          spellcheck="false"
          maxlength="32"
        />
        <label for="contrasena">Contraseña</label>
        <input
          id="contrasena"
          name="contrasena"
          type="password"
          autocomplete="current-password"
          required
          maxlength="256"
        />
        <button type="submit">Entrar</button>
      </form></main>
